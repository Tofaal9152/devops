<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Learning HTML on My VPS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        background: radial-gradient(circle at top, #1f2933, #020617);
        color: #e5e7eb;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .card {
        background: rgba(15, 23, 42, 0.9);
        border-radius: 16px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        max-width: 720px;
        width: 100%;
        padding: 28px 24px 24px;
        border: 1px solid rgba(148, 163, 184, 0.3);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        background: rgba(22, 163, 74, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.5);
        color: #bbf7d0;
        padding: 4px 10px;
        border-radius: 999px;
        margin-bottom: 14px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #22c55e;
        box-shadow: 0 0 12px #22c55e;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 8px;
      }

      h1 span {
        color: #38bdf8;
      }

      .subtitle {
        color: #9ca3af;
        font-size: 14px;
        margin-bottom: 20px;
      }

      .section-title {
        font-size: 16px;
        margin-bottom: 6px;
        color: #e5e7eb;
      }

      p {
        font-size: 14px;
        line-height: 1.6;
        color: #d1d5db;
        margin-bottom: 10px;
      }

      ul {
        list-style: none;
        margin-top: 4px;
        margin-bottom: 14px;
      }

      li {
        font-size: 14px;
        color: #e5e7eb;
        margin-bottom: 4px;
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }

      li::before {
        content: "•";
        color: #38bdf8;
        font-size: 16px;
        line-height: 1;
        margin-top: 1px;
      }

      .footer {
        border-top: 1px solid rgba(55, 65, 81, 0.8);
        margin-top: 16px;
        padding-top: 10px;
        font-size: 12px;
        color: #9ca3af;
        display: flex;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }

      .footer span strong {
        color: #e5e7eb;
        font-weight: 600;
      }

      .tag {
        font-size: 12px;
        background: rgba(15, 118, 110, 0.2);
        border-radius: 999px;
        padding: 3px 9px;
        border: 1px solid rgba(45, 212, 191, 0.6);
        color: #a5f3fc;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">
        <span class="dot"></span>
        <span>HTML + Nginx on VPS</span>
      </div>

      <h1>Hi there home 👋 <span>I'm learning HTML</span></h1>
    </main>
  </body>
</html>
